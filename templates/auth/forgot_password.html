<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>استعادة كلمة المرور — SMARTLOG</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', Arial, sans-serif; background: #080c18; color: #f0f4f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #0f172a; border: 1px solid #1e2a45; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; margin: 16px; }
    .logo { width: 48px; height: 48px; border-radius: 50%; background: #dc262620; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; border: 2px solid #dc2626; }
    .logo i { font-size: 22px; color: #ef4444; }
    h1 { font-size: 18px; text-align: center; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #8899b4; text-align: center; margin-bottom: 20px; }
    .input-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #8899b4; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; background: #141d33; border: 1px solid #1e2a45; border-radius: 10px; color: #f0f4f9; font-size: 14px; font-family: inherit; }
    input:focus { outline: none; border-color: #dc2626; }
    .btn { width: 100%; padding: 10px; background: #dc2626; border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 4px; }
    .btn:hover { background: #ef4444; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 12px; margin-top: 4px; display: none; }
    .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; }
    .back-link a { color: #8899b4; text-decoration: none; }
    .back-link a:hover { color: #f0f4f9; }
    .captcha-box { background: #141d33; border: 1px solid #1e2a45; border-radius: 10px; padding: 12px; text-align: center; font-size: 18px; font-weight: 700; color: #f0f4f9; margin-bottom: 10px; letter-spacing: 2px; }
    .success-icon { color: #22c55e; font-size: 48px; display: block; text-align: center; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><i class="ti ti-lock-question"></i></div>
    <h1>استعادة كلمة المرور</h1>
    <p class="sub">أدخل رقمك الوظيفي وأجب عن سؤال التحقق</p>
    <div class="error" id="errorMsg" role="alert"></div>
    <form id="forgotForm" onsubmit="return doForgot(event)">
      <div class="input-group">
        <label>الرقم الوظيفي</label>
        <input type="text" id="username" placeholder="مثال: EMP001" autocomplete="username" required>
      </div>
      <div class="input-group">
        <label>تحقق أمني</label>
        <div class="captcha-box">{{ captcha_question }}</div>
        <input type="text" id="captcha" placeholder="أدخل الإجابة" autocomplete="off" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">تحقق وإرسال</button>
    </form>
    <div class="back-link"><a href="{{ url_for('auth.login') }}"><i class="ti ti-arrow-right"></i> العودة إلى تسجيل الدخول</a></div>
  </div>
  <script>
    function doForgot(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('errorMsg');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'جاري التحقق...';
      var csrf = document.querySelector('meta[name="csrf-token"]');
      fetch('/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf ? csrf.content : '' },
        body: JSON.stringify({ username: document.getElementById('username').value, captcha: document.getElementById('captcha').value })
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.ok) { window.location.href = data.redirect; }
        else { err.textContent = data.msg || 'حدث خطأ'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'تحقق وإرسال'; }
      }).catch(function() {
        err.textContent = 'فشل الاتصال بالخادم'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'تحقق وإرسال';
      });
      return false;
    }
  </script>
</body>
</html>
