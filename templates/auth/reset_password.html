<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>إعادة تعيين كلمة المرور — SMARTLOG</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', Arial, sans-serif; background: #080c18; color: #f0f4f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #0f172a; border: 1px solid #1e2a45; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; margin: 16px; }
    .logo { width: 48px; height: 48px; border-radius: 50%; background: #6366f120; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; border: 2px solid #6366f1; }
    .logo i { font-size: 22px; color: #818cf8; }
    h1 { font-size: 18px; text-align: center; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #8899b4; text-align: center; margin-bottom: 20px; }
    .input-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #8899b4; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; background: #141d33; border: 1px solid #1e2a45; border-radius: 10px; color: #f0f4f9; font-size: 14px; font-family: inherit; }
    input:focus { outline: none; border-color: #6366f1; }
    .btn { width: 100%; padding: 10px; background: #6366f1; border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 4px; }
    .btn:hover { background: #818cf8; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 12px; margin-top: 4px; display: none; }
    .strength { height: 4px; border-radius: 2px; margin-top: 6px; transition: all .2s; }
    .hint { font-size: 11px; color: #566580; margin-top: 4px; }
    .user-badge { background: #141d33; border: 1px solid #1e2a45; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }
    .user-badge span { display: block; font-size: 12px; color: #8899b4; }
    .user-badge strong { font-size: 14px; color: #f0f4f9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><i class="ti ti-lock"></i></div>
    <h1>إعادة تعيين كلمة المرور</h1>
    <p class="sub">اختر كلمة مرور جديدة لحسابك</p>
    <div class="user-badge">
      <span>رقم الموظف</span>
      <strong>{{ username }} — {{ full_name }}</strong>
    </div>
    <div class="error" id="errorMsg" role="alert"></div>
    <form id="resetForm" onsubmit="return doReset(event)">
      <div class="input-group">
        <label>كلمة المرور الجديدة</label>
        <input type="password" id="pw" oninput="checkStrength(this.value)" autocomplete="new-password" required minlength="6">
        <div class="strength" id="strengthBar" style="width:0;background:#dc2626"></div>
        <div class="hint">يجب أن تحتوي على 6 أحرف على الأقل، حرف كبير، حرف صغير، رقم</div>
      </div>
      <div class="input-group">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="pw2" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">حفظ كلمة المرور الجديدة</button>
    </form>
    <div class="back-link" style="text-align:center;margin-top:16px;font-size:13px"><a href="{{ url_for('auth.login') }}" style="color:#8899b4;text-decoration:none"><i class="ti ti-arrow-right"></i> العودة إلى تسجيل الدخول</a></div>
  </div>
  <script>
    function checkStrength(pw) {
      var bar = document.getElementById('strengthBar');
      var score = 0;
      if (pw.length >= 6) score++;
      if (/[a-z]/.test(pw)) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^a-zA-Z0-9]/.test(pw)) score++;
      var pct = (score / 5) * 100;
      bar.style.width = pct + '%';
      bar.style.background = pct < 40 ? '#dc2626' : pct < 80 ? '#f59e0b' : '#22c55e';
    }
    function doReset(e) {
      e.preventDefault();
      var pw = document.getElementById('pw').value;
      var pw2 = document.getElementById('pw2').value;
      var err = document.getElementById('errorMsg');
      err.style.display = 'none';
      if (pw.length < 6) { err.textContent = 'كلمة المرور قصيرة جداً'; err.style.display = 'block'; return false; }
      if (pw !== pw2) { err.textContent = 'كلمتا المرور غير متطابقتين'; err.style.display = 'block'; return false; }
      var btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'جاري الحفظ...';
      var csrf = document.querySelector('meta[name="csrf-token"]');
      fetch('/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf ? csrf.content : '' },
        body: JSON.stringify({ password: pw })
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.ok) { window.location.href = data.redirect; }
        else { err.textContent = data.msg || 'حدث خطأ'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'حفظ كلمة المرور الجديدة'; }
      }).catch(function() {
        err.textContent = 'فشل الاتصال بالخادم'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'حفظ كلمة المرور الجديدة';
      });
      return false;
    }
  </script>
</body>
</html>
