<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الأجهزة — SMARTLOG</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Cairo',sans-serif; background:#080c18; color:#e2e8f0; padding:24px; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .header h1 { font-size:20px; }
    table { width:100%; border-collapse:collapse; background:#0f172a; border-radius:12px; overflow:hidden; }
    th, td { padding:12px 16px; text-align:right; border-bottom:1px solid #1e2a45; font-size:14px; }
    th { background:#1e2a45; color:#94a3b8; font-weight:600; }
    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; }
    .badge.online { background:#064e3b; color:#6ee7b7; }
    .badge.offline { background:#450a0a; color:#fca5a5; }
    .badge.warning { background:#713f12; color:#fcd34d; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:#1e2a45; border:1px solid #2d3a56; border-radius:8px; color:#e2e8f0; text-decoration:none; font-size:13px; cursor:pointer; font-family:'Cairo',sans-serif; }
    .btn-primary { background:#dc2626; border-color:#dc2626; }
    .btn-sm { padding:4px 10px; font-size:12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="ti ti-fingerprint"></i> إدارة الأجهزة</h1>
    <div>
      <button class="btn btn-primary" onclick="showAddModal()"><i class="ti ti-plus"></i> إضافة جهاز</button>
      <a href="/admin" class="btn"><i class="ti ti-arrow-right"></i> العودة</a>
    </div>
  </div>

  <table>
    <thead>
      <tr><th>الرقم التسلسلي</th><th>الاسم</th><th>الشركة</th><th>IP</th><th>الحالة</th><th>آخر مزامنة</th><th></th></tr>
    </thead>
    <tbody id="devicesBody"></tbody>
  </table>

  <script>
    function getCSRF() { var m = document.querySelector('meta[name="csrf-token"]'); return m ? m.getAttribute('content') : ''; }
    async function loadDevices() {
      try {
        var r = await fetch('/api/admin/devices/list', { headers: { 'X-CSRFToken': getCSRF() } });
        var d = await r.json();
        if (!d.ok) return;
        var tbody = document.getElementById('devicesBody');
        tbody.innerHTML = '';
        d.devices.forEach(function(dev) {
          var badge = 'offline';
          if (dev.online_status === 'online') badge = 'online';
          else if (dev.online_status === 'warning') badge = 'warning';
          tbody.innerHTML += '<tr><td>' + esc(dev.serial_no) + '</td><td>' + esc(dev.name) + '</td><td>' + esc(dev.company_name || '-') + '</td><td>' + esc(dev.ip_address || '-') + '</td><td><span class="badge ' + badge + '">' + (badge === 'online' ? 'متصل' : badge === 'warning' ? 'تحذير' : 'غير متصل') + '</span></td><td>' + esc(dev.last_sync || '-') + '</td><td><button class="btn btn-sm" onclick="alert(\'التفاصيل\')"><i class="ti ti-eye"></i></button></td></tr>';
        });
      } catch(e) {}
    }
    loadDevices();
    setInterval(loadDevices, 15000);
  </script>
</body>
</html>
